{% extends "base.html" %}
{% block content %}
<div class="narrow card">
<h1>Acceso administrativo</h1>
<p class="muted">Ingrese sus credenciales autorizadas.</p>
<form method="post">
<label>Usuario</label><input name="username" required autocomplete="username">
<label>Contraseña</label><input type="password" name="password" required autocomplete="current-password">
<button class="button full">Ingresar</button>
</form>
<p class="small muted">Al iniciar por primera vez, cambie la contraseña predeterminada siguiendo el README.</p>
</div>
{% endblock %}
