{% extends "base.html" %}
{% block content %}
<div class="narrow card">
<p class="eyebrow">SEGURIDAD</p><h1>Cambiar contraseña</h1>
<p class="muted">Cuenta: <b>{{ session.get('admin') }}</b>. Use una contraseña única de al menos 12 caracteres.</p>
<form method="post" id="pwdForm">
<label>Contraseña actual</label><input type="password" name="current" required autocomplete="current-password">
<label>Nueva contraseña (mínimo 12 caracteres)</label><input type="password" name="new" id="newPwd" required minlength="12" autocomplete="new-password">
<label>Repetir nueva contraseña</label><input type="password" name="confirm" id="confirmPwd" required minlength="12" autocomplete="new-password">
<div id="pwdHint" class="small muted" role="status"></div>
<button class="button full">Guardar contraseña</button>
</form>
<p class="small muted">Al cambiarla, use la nueva contraseña en su próximo inicio de sesión. No la comparta con otras personas.</p>
</div>
<script>
(function(){
  const n=document.getElementById('newPwd'), c=document.getElementById('confirmPwd'), h=document.getElementById('pwdHint');
  function check(){
    if(!n.value && !c.value){ h.textContent=''; return; }
    if(n.value.length<12){ h.textContent='Faltan '+(12-n.value.length)+' caracteres.'; return; }
    h.textContent = (c.value && c.value!==n.value) ? 'La confirmación no coincide.' : 'Longitud correcta.';
  }
  n.addEventListener('input',check); c.addEventListener('input',check);
})();
</script>
{% endblock %}
